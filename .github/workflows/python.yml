name: Python

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/python.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/python.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Lint & test (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tickets_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLASK_APP: main.py
      FLASK_ENV: production
      SECRET_KEY: ci-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tickets_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tickets_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Apply migrations (verifies they run on Postgres)
        run: |
          flask db upgrade
          flask db downgrade base

      - name: Run tests
        run: pytest --cov=server --cov-report=term-missing
