name: Node

on:
  push:
    branches: [main]
    paths: ["admin/**", "client/**", ".github/workflows/node.yml"]
  pull_request:
    branches: [main]
    paths: ["admin/**", "client/**", ".github/workflows/node.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [admin, client]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    env:
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build
